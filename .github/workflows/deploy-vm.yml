# =============================================================================
# Deploy — Oracle Cloud VM (ASP.NET Core API + Python AI Service + Web)
# Strategy: Build Docker images → push to ghcr.io → SSH into Oracle VM → pull & restart
#
# Secrets required (set at GitHub Org level):
#   VPS_HOST      — Public IP or hostname of the Oracle VM
#   VPS_USER      — SSH user (ubuntu)
#   VPS_SSH_KEY   — Private SSH key (PEM format, stored as org secret)
# =============================================================================
name: Deploy — Oracle VM (API + AI + Web)

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "ai/**"
      - "web/**"
      - "docker-compose.prod.yml"
      - ".github/workflows/deploy-vm.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  ORG: openparking-org

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Build and push Docker images to ghcr.io
  # ---------------------------------------------------------------------------
  build-images:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # needed to push to ghcr.io

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.ORG }}/api:latest
            ${{ env.REGISTRY }}/${{ env.ORG }}/api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push AI service image
        uses: docker/build-push-action@v5
        with:
          context: ./ai
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.ORG }}/ai:latest
            ${{ env.REGISTRY }}/${{ env.ORG }}/ai:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Web image
        uses: docker/build-push-action@v5
        with:
          context: ./web
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.ORG }}/web:latest
            ${{ env.REGISTRY }}/${{ env.ORG }}/web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Job 2: SSH into Oracle VM and pull new images
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to Oracle VM
    runs-on: ubuntu-latest
    needs: build-images
    environment: production # Requires manual approval in GitHub Environments

    steps:
      - name: Checkout (for docker-compose.prod.yml)
        uses: actions/checkout@v4

      - name: Copy docker-compose.prod.yml to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: "~/openparking/"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ~/openparking

            # Log in to ghcr.io on the VM using the deploy token
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull all latest images
            docker pull ghcr.io/openparking-org/api:latest
            docker pull ghcr.io/openparking-org/ai:latest
            docker pull ghcr.io/openparking-org/web:latest

            # Start / update all services
            docker compose -f docker-compose.prod.yml --env-file .env up -d api ai web redis

            # Health check (allow 60s for startup)
            sleep 60
            curl -f http://localhost:5000/health || (echo "API health check failed!" && exit 1)
            curl -f http://localhost:8000/health || (echo "AI health check failed!" && exit 1)

            echo "Deployment successful — $(date)"
