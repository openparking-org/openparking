# =============================================================================
# Deploy — Oracle Cloud VM (ASP.NET Core API + Python AI Service)
# Strategy: Build Docker images → push to ghcr.io → SSH into Oracle VM → pull & restart
#
# Secrets required (set at GitHub Org level):
#   ORACLE_VM_HOST      — Public IP or hostname of the Oracle VM
#   ORACLE_VM_USER      — SSH user (e.g. ubuntu or opc)
#   ORACLE_VM_SSH_KEY   — Private SSH key (PEM format, stored as org secret)
#   GHCR_TOKEN          — GitHub token with packages:write (use secrets.GITHUB_TOKEN)
# =============================================================================
name: Deploy — Oracle VM (API + AI)

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "ai/**"
      - "docker-compose.prod.yml"
      - ".github/workflows/deploy-vm.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  ORG: openparking-org

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Build and push Docker images to ghcr.io
  # ---------------------------------------------------------------------------
  build-images:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # needed to push to ghcr.io

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: ./api
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.ORG }}/api:latest
            ${{ env.REGISTRY }}/${{ env.ORG }}/api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push AI service image
        uses: docker/build-push-action@v7
        with:
          context: ./ai
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.ORG }}/ai:latest
            ${{ env.REGISTRY }}/${{ env.ORG }}/ai:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Job 2: SSH into Oracle VM and pull new images
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to Oracle VM
    runs-on: ubuntu-latest
    needs: build-images
    environment: production # Requires manual approval in GitHub Environments

    steps:
      - name: Checkout (for docker-compose.prod.yml)
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ORACLE_VM_HOST }}
          username: ${{ secrets.ORACLE_VM_USER }}
          key: ${{ secrets.ORACLE_VM_SSH_KEY }}
          script: |
            # Log in to ghcr.io on the VM
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull the latest images
            docker pull ghcr.io/openparking-org/api:latest
            docker pull ghcr.io/openparking-org/ai:latest

            # Restart services with zero-downtime (docker compose rolling update)
            cd ~/openparking
            docker compose -f docker-compose.prod.yml up -d --no-deps api ai

            # Run EF Core migrations against Neon PostgreSQL
            docker compose -f docker-compose.prod.yml exec -T api \
              dotnet ef database update \
              --project OpenParking.Infrastructure \
              --startup-project OpenParking.Api

            # Health check
            sleep 5
            curl -f http://localhost:5000/health || (echo "Health check failed!" && exit 1)

            echo "Deployment successful — $(date)"
