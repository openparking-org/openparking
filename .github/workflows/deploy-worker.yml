# =============================================================================
# Deploy — Cloudflare Worker (Edge API Gateway)
# Runs on: push to main that touches /worker/**
# Secrets required (set at GitHub Org level):
#   CF_API_TOKEN        — Cloudflare API token with Workers:Edit permission
#   CF_ACCOUNT_ID       — Cloudflare account ID
# =============================================================================
name: Deploy — Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  deploy:
    name: Deploy Worker to Cloudflare
    runs-on: ubuntu-latest
    environment: production # Requires org-level environment approval

    defaults:
      run:
        working-directory: worker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Worker tests
        run: npm test

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: worker
          # wrangler.toml in /worker defines the worker name, routes, and env vars
