# =============================================================================
# CI — AI Service (Python / LangGraph)
# Runs on: every push/PR that touches /ai/**
# =============================================================================
name: CI — AI Service

on:
  push:
    branches: [main, develop]
    paths:
      - "ai/**"
      - ".github/workflows/ci-ai.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "ai/**"
      - ".github/workflows/ci-ai.yml"

jobs:
  test:
    name: Lint & Test (Python 3.11)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: openparking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://testuser:testpassword@localhost:5432/openparking_test"
      # Mock Cloudflare Workers AI in CI — no real API key needed
      CF_AI_MODE: "mock"
      ENVIRONMENT: "testing"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('ai/requirements*.txt') }}
          restore-keys: pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r ai/requirements.txt
          pip install -r ai/requirements-dev.txt

      - name: Lint with ruff
        run: ruff check ai/

      - name: Type check with mypy
        run: mypy ai/ --ignore-missing-imports

      - name: Run agent unit tests
        run: pytest ai/tests/unit/ -v --tb=short

      - name: Run agent integration tests (golden cases)
        run: pytest ai/tests/integration/ -v --tb=short -m "not slow"

      - name: Run agent evaluation (golden workflow case)
        run: pytest ai/tests/evaluation/ -v --tb=long
        # This is the minimum acceptance workflow test required by the spec

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-test-results
          path: ai/test-results/
