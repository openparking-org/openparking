version: 2

updates:
  # ASP.NET Core / NuGet
  - package-ecosystem: nuget
    directory: /api
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies", "dotnet"]

  # React / npm
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies", "frontend"]

  # Cloudflare Worker / npm
  - package-ecosystem: npm
    directory: /worker
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels: ["dependencies", "worker"]

  # Python / pip (LangGraph AI service)
  - package-ecosystem: pip
    directory: /ai
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies", "ai"]

  # Flutter / pub
  - package-ecosystem: pub
    directory: /mobile
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies", "flutter"]

  # Docker base images
  - package-ecosystem: docker
    directory: /api
    schedule:
      interval: weekly
    labels: ["dependencies", "docker"]

  - package-ecosystem: docker
    directory: /ai
    schedule:
      interval: weekly
    labels: ["dependencies", "docker"]

  # GitHub Actions themselves
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: ["dependencies", "ci"]
