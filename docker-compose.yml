services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ConnectionStrings__Default=${DATABASE_URL:-postgresql://dev:dev@db:5432/openparking}
      - JWT__Secret=${JWT_SECRET:-dev-super-secret-key-that-is-at-least-32-chars-long}
      - JWT__ExpiryHours=${JWT_EXPIRY_HOURS:-24}
      - MAPBOX_ACCESS_TOKEN=${MAPBOX_ACCESS_TOKEN:-pk.demo}
      - RESEND_API_KEY=${RESEND_API_KEY:-re_demo}
      - AI_SERVICE_URL=http://ai:8000
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  ai:
    build:
      context: ./ai
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - CF_ACCOUNT_ID=${CF_ACCOUNT_ID:-mock-account}
      - CF_AI_TOKEN=${CF_AI_TOKEN:-mock-token}
      - CF_AI_MODE=${CF_AI_MODE:-mock}
      - DATABASE_URL=${DATABASE_URL:-postgresql://dev:dev@db:5432/openparking}
    depends_on:
      db:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: openparking
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d openparking"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
