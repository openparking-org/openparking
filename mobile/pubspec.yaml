name: mobile
description: "OpenParking Driver Mobile App — Flutter 3"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  http: ^1.2.0
  intl: ^0.19.0
  flutter_secure_storage: ^11.2.0
  flutter_dotenv: ^6.0.1
  go_router: ^17.5.0
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2
  google_fonts: ^6.2.1
  geolocator: ^14.0.2
  mapbox_maps_flutter: ^3.0.0
  mobile_scanner: ^7.4.2
  signalr_netcore: ^1.3.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf
  assets:
    - .env
