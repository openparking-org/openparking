services:
  api:
    image: ghcr.io/openparking-org/api:latest
    restart: always
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__Default=${NEON_DATABASE_URL}
      - JWT__Secret=${JWT_SECRET}
      - JWT__ExpiryHours=24
      - MAPBOX_ACCESS_TOKEN=${MAPBOX_ACCESS_TOKEN}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - AI_SERVICE_URL=http://ai:8000
      - REDIS_URL=redis:6379,abortConnect=false
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  ai:
    image: ghcr.io/openparking-org/ai:latest
    restart: always
    ports:
      - "8000:8000"
    environment:
      - CF_ACCOUNT_ID=${CF_ACCOUNT_ID}
      - CF_AI_TOKEN=${CF_AI_TOKEN}
      - CF_AI_MODE=${CF_AI_MODE:-live}
      - DATABASE_URL=${NEON_DATABASE_URL}
      - API_KEY=${AI_API_KEY}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

volumes:
  redis_data:
